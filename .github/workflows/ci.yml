name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: internal/javascriptgen/testdata/canonical/package-lock.json
      - run: go test ./...
      - run: go vet ./...
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: internal/javascriptgen/testdata/canonical
      - run: npm run typecheck
        working-directory: internal/javascriptgen/testdata/canonical
      - run: npm run build
        working-directory: internal/javascriptgen/testdata/canonical
      - run: npx --no-install tsc -p test/tsconfig.json
        working-directory: internal/javascriptgen/testdata/canonical
      - run: node --conditions=browser --test test/runtime.test.mjs
        working-directory: internal/javascriptgen/testdata/canonical
      - run: npm pack --dry-run --json
        working-directory: internal/javascriptgen/testdata/canonical

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test -race ./...
