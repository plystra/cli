# Account capability.

id: 'account.register/v2' # Exact identity.
description: Registers an account.
request:
  email: {type: string, required: true} # Login address.
response: {}
errors: [already_exists]
semantics:
  kind: query
  effects: none
  idempotency: {mode: inherent}
  retry: {safety: safe}
  cancellation: {mode: best-effort}
  completion: {mode: completed-before-return}
  ordering: {mode: none}
  data: {request: public, response: public}
extensions:
  authn: {authenticated: true}
